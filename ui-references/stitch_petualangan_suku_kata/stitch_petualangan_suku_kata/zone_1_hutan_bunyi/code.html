<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            user-select: none;
        }
        .chunky-shadow-primary {
            box-shadow: 0px 8px 0px 0px #084c5f;
        }
        .chunky-shadow-primary:active {
            transform: translateY(4px);
            box-shadow: 0px 4px 0px 0px #084c5f;
        }
        .chunky-shadow-secondary {
            box-shadow: 0px 8px 0px 0px #005316;
        }
        .chunky-shadow-secondary:active {
            transform: translateY(4px);
            box-shadow: 0px 4px 0px 0px #005316;
        }
        .chunky-shadow-tertiary {
            box-shadow: 0px 8px 0px 0px #b89c00;
        }
        .chunky-shadow-tertiary:active {
            transform: translateY(4px);
            box-shadow: 0px 4px 0px 0px #b89c00;
        }
        .chunky-shadow-error {
            box-shadow: 0px 8px 0px 0px #93000a;
        }
        .chunky-shadow-error:active {
            transform: translateY(4px);
            box-shadow: 0px 4px 0px 0px #93000a;
        }

        @keyframes pulse-speaker {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }
        .pulse-animation {
            animation: pulse-speaker 2s infinite ease-in-out;
        }
        
        .jungle-gradient {
            background: linear-gradient(to bottom, #baeaff 0%, #f7f9fc 100%);
        }

        .balloon-bounce {
            animation: bounce-float 3s infinite ease-in-out;
        }
        @keyframes bounce-float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
<style>

<body class="bg-surface-bright font-body-lg text-on-surface m-0 p-0 overflow-hidden select-none">

            </div>
</div>
<button class="bg-surface-container-high text-primary rounded-full w-12 h-12 flex items-center justify-center hover:translate-y-1 transition-transform active:translate-y-1 active:shadow-none">

</button>
<div class="flex items-center gap-4">

<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">stars</span>
                100
            </div>
<button class="text-primary hover:translate-y-1 transition-transform active:translate-y-1">
<span class="material-symbols-outlined text-[32px]" data-icon="home">home</span>
</button>
</div>
</header>
<!-- Main Game Canvas -->
<main class="relative w-full h-[calc(100vh-56px)] jungle-gradient overflow-hidden flex flex-col items-center pt-8">
<!-- Background Decor (Jungle Trees) -->

<div class="absolute -bottom-10 -left-20 w-80 h-96 opacity-40 bg-secondary rounded-full blur-3xl"></div>
<div class="absolute -bottom-10 -right-20 w-80 h-96 opacity-40 bg-primary rounded-full blur-3xl"></div>
<!-- Abstract Trees -->
<div class="absolute bottom-0 left-8 flex flex-col items-center">
<div class="w-16 h-32 bg-[#5d4037] rounded-t-lg"></div>
<div class="w-48 h-48 -mt-40 bg-secondary rounded-full flex items-center justify-center border-b-8 border-[#005316]"></div>
</div>
<div class="absolute bottom-0 right-12 flex flex-col items-center">
<div class="w-12 h-24 bg-[#5d4037] rounded-t-lg"></div>

</div>
</div>
<!-- Content Section -->

<!-- Character Prompt Card -->

<button class="relative group" onclick="playSyllableSound()">

</button>

<!-- Feedback Toast (Hidden by default) -->
<div class="fixed top-20 left-1/2 -translate-x-1/2 z-[100] transform -translate-y-40 transition-transform duration-500 ease-out" id="feedback-toast">
<div class="bg-secondary text-on-secondary font-label-bold text-label-bold py-4 px-10 rounded-full shadow-2xl flex items-center gap-3 border-4 border-white" id="feedback-bg">
<span class="material-symbols-outlined text-[40px]" id="feedback-icon">check_circle</span>
<span id="feedback-text">KEREN!</span>
</div>
</div>
<script>
        function playSyllableSound() {
            // Simulated sound play
            const parrot = document.querySelector('.pulse-animation');
            parrot.classList.remove('pulse-animation');
            void parrot.offsetWidth; // trigger reflow
            parrot.classList.add('pulse-animation');
            
            // In a real app, an audio file would play here
            console.log("Playing Sound: BA");
        }

        function checkAnswer(syllable) {
            const toast = document.getElementById('feedback-toast');
            const bg = document.getElementById('feedback-bg');
            const icon = document.getElementById('feedback-icon');
            const text = document.getElementById('feedback-text');
            const reveal = document.getElementById('syllable-reveal');

            if (syllable === 'BA') {
                // Success
                bg.className = "bg-secondary text-on-secondary font-label-bold text-label-bold py-4 px-10 rounded-full shadow-2xl flex items-center gap-3 border-4 border-white chunky-shadow-secondary";
                icon.innerText = "stars";
                text.innerText = "HEBAT! BA!";
                reveal.classList.remove('hidden');
                
                // Pop effect for chosen balloon
                event.currentTarget.classList.add('scale-110');
                setTimeout(() => event.currentTarget.classList.remove('scale-110'), 200);
            } else {
                // Incorrect
                bg.className = "bg-error text-on-error font-label-bold text-label-bold py-4 px-10 rounded-full shadow-2xl flex items-center gap-3 border-4 border-white chunky-shadow-error";
                icon.innerText = "error";
                text.innerText = "COBA LAGI!";
            }

            // Show Toast
            toast.classList.remove('-translate-y-40');
            toast.classList.add('translate-y-0');

            // Hide Toast
            setTimeout(() => {
                toast.classList.add('-translate-y-40');
                toast.classList.remove('translate-y-0');
                if (syllable === 'BA') {
                    // Reset for next round or continue
                }
            }, 2000);
        }
    </script>

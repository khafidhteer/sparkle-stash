<script>
        // Simple Confetti Generator
        const container = document.getElementById('confetti-container');
        const colors = ['#0c6780', '#016e21', '#ffe16d', '#ba1a1a', '#87ceeb'];
        
        function createConfetti() {
            for (let i = 0; i < 50; i++) {
                const confetto = document.createElement('div');
                confetto.classList.add('confetti');
                confetto.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetto.style.left = Math.random() * 100 + 'vw';
                confetto.style.top = '-10px';
                confetto.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                confetto.style.transform = `rotate(${Math.random() * 360}deg)`;
                
                const duration = Math.random() * 3 + 2;
                const delay = Math.random() * 2;
                
                confetto.style.animation = `confetti-fall ${duration}s linear ${delay}s forwards`;
                
                container.appendChild(confetto);
                
                // Remove after animation
                setTimeout(() => {
                    confetto.remove();
                }, (duration + delay) * 1000);
            }
        }

        // Trigger confetti on load
        window.addEventListener('load', () => {
            createConfetti();
            // Interval for periodic bursts
            setInterval(createConfetti, 4000);
        });

        // Add some interactive hover sound mock or behavior
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('mouseenter', () => {
                // Potential for slight scale up on hover if not covered by active state
            });
        });

<body class="bg-primary-container min-h-screen pb-32">

<button class="w-touch-target-min h-touch-target-min flex items-center justify-center bg-surface-container rounded-lg chunky-shadow-card hover:translate-y-1 transition-all active:translate-y-1 active:shadow-none">
<span class="material-symbols-outlined text-primary text-[32px]">settings</span>
</button>
</div>
<h1 class="font-display-hero-mobile text-display-hero-mobile text-primary tracking-tight">Suku Kata</h1>
<div class="flex items-center gap-3">
<button class="w-touch-target-min h-touch-target-min flex items-center justify-center bg-tertiary-container text-on-tertiary-container rounded-lg chunky-shadow-card hover:translate-y-1 transition-all active:translate-y-1 active:shadow-none" title="Stickers">
<span class="material-symbols-outlined text-[32px]">stars</span>
</button>
<button class="w-touch-target-min h-touch-target-min flex items-center justify-center bg-secondary-container text-on-secondary-container rounded-lg chunky-shadow-card hover:translate-y-1 transition-all active:translate-y-1 active:shadow-none" title="Info">
<span class="material-symbols-outlined text-[32px]">info</span>
</button>
</div>
</header>
<main class="max-w-md mx-auto px-gutter pt-8 space-y-8">
<!-- Main Headline -->
<div class="text-center space-y-2">
<div class="flex justify-center items-center gap-2 mb-2">
<span class="material-symbols-outlined text-tertiary text-4xl animate-bounce">videogame_asset</span>
<span class="material-symbols-outlined text-secondary text-4xl animate-pulse" style="font-variation-settings: 'FILL' 1;">stars</span>
</div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface uppercase tracking-wide">PETUALANGAN SUKU KATA</h2>
</div>
<!-- Main Feature Card: SYLLABLE SAFARI -->
<section class="island-card overflow-hidden p-6 border-4 border-white">
<div class="relative rounded-xl overflow-hidden mb-6 aspect-video bg-secondary-container">
<img alt="Colorful Parrot in Jungle" class="w-full h-full object-cover" data-alt="A vibrant, multi-colored parrot with brilliant blue and yellow feathers perched on a lush tropical branch. The background is a dense, stylized jungle filled with deep emerald leaves and soft, magical sunlight filtering through the canopy. The image has a friendly, high-contrast illustrated feel consistent with a child-friendly educational game, featuring soft-tactile modernism and a warm, inviting atmosphere." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCjBJkQoJHMCITM_rQygY5RmMBGTefhhuSwcZbF29e_6q5U5aO7nG07rV0kCaMI5fI2TCaPGtiI0BpmPjp_gQ_Lx6arWv1_mdtccuhFOFn1B0y8o0CU31lTiqHVkrUvQpd69S78dht8jbFS-76CBgSvCTnpbrVpUmy7CaiwHZLYE8IGxuv3oeIPmK766iMjBB3avng1ttRfnDKwrvJAL9x7IZXuNUcM0hWRwSc7f_mO9i5Q9gbMpkYc2o99vEXn_ROnpF9kYDngl0hL"/>
<div class="absolute inset-0 bg-gradient-to-t from-black/40 to-transparent"></div>
<div class="absolute bottom-4 left-4">
<span class="bg-primary text-on-primary px-4 py-1 rounded-full font-label-bold text-sm tracking-widest uppercase">SYLLABLE SAFARI</span>
</div>
</div>
<div class="space-y-4 text-center">
<h3 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Learn Syllables!</h3>
<p class="font-body-lg text-on-surface-variant">Join our parrot friend on a jungle quest to master words!</p>
<button class="w-full py-6 bg-secondary text-on-secondary rounded-xl chunky-shadow-secondary hover:scale-[1.02] transition-transform active:translate-y-1 active:shadow-none flex items-center justify-center gap-3">
<span class="font-label-bold text-label-bold">TAP TO PLAY</span>
<span class="material-symbols-outlined text-3xl">play_circle</span>
</button>
</div>
</section>

</div>
</div>

</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-2 hover:scale-105 transition-transform active:translate-y-1" href="#">
<span class="material-symbols-outlined text-[32px]">person</span>
<span class="font-label-bold text-[12px] leading-tight">Profil</span>

<script>
        // Micro-interactions for chunky buttons
        document.querySelectorAll('button, a').forEach(btn => {
            btn.addEventListener('touchstart', () => {
                btn.classList.add('scale-95');
            });
            btn.addEventListener('touchend', () => {
                btn.classList.remove('scale-95');
            });
        });

        // Atmospheric gentle float animation for elements
        const animateBadges = () => {
            const footer = document.querySelector('footer div');
            if(footer) {
                let angle = 0;
                setInterval(() => {
                    angle += 0.05;
                    const y = Math.sin(angle) * 5;
                    footer.style.transform = `translateY(${y}px)`;
                }, 50);
            }
        };
        animateBadges();
    </script>
</body></html>
